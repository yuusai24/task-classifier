  "self>trust":     "自分で決めたい。でも自分の感覚にまだ自信が持てないタイプ",
  "self>action":    "意志はしっかりある。あとは一歩目を小さく踏み出すタイプ",
};

const app = document.getElementById("app");
let answers = new Array(QUESTIONS.length).fill(null);
let current = 0;

function axisName(key) { return AXES.find(a => a.key === key).name; }

function renderIntro() {
  app.innerHTML = `
    <img class="hero" src="hero.webp" width="1254" height="1254" alt="守護霊ビジネスパートナー診断　今の自分が守護霊をビジネスパートナーにできるかチェック　受信力・自己信頼・行動力・主体性から診断">
    <header style="display:grid;gap:10px;text-align:center">
      <h1 class="sr-only">守護霊ビジネスパートナー診断</h1>
      <p class="muted">サポートを受け取って活かせる状態かどうか、<br>今のあなたの「パートナー度」を見てみよう。</p>
      <p class="muted">今の自分にあてはまれば YES、あてはまらなければ NO。<br>考えすぎず、直感で答えてね。</p>
    </header>
    <button class="btn" id="start">診断をはじめる</button>
    <p class="note">この診断は、今の在り方を見つめるためのセルフチェックです。</p>
  `;
  document.getElementById("start").onclick = () => { current = 0; renderQuestion(); };
}

function renderQuestion() {
  const [axis, text] = QUESTIONS[current];
  const img = QUESTION_IMAGES[current + 1];
  const card = QUESTION_CARDS[current + 1];
  const done = answers.filter(v => v !== null).length;
  const pos = r => `left:${r.left}%;top:${r.top}%;width:${r.width}%;height:${r.height}%`;
  const progress = `
    <div class="progress">
      <div class="bar"><i style="width:${(done / QUESTIONS.length) * 100}%"></i></div>
    </div>`;
  app.innerHTML = card ? `
    ${progress}
    <section class="q-card">
      <img src="${card.src}" width="${card.w || 1254}" height="${card.h || 1254}" alt="">
      <h2 class="sr-only">Q${current + 1} ${text}</h2>
      ${card.yes ? `
      <button class="choice hot" data-pts="0" style="${pos(card.yes)}" aria-label="YES（あてはまる）" aria-pressed="${answers[current] === 0}"></button>
      <button class="choice hot" data-pts="1" style="${pos(card.no)}" aria-label="NO（あてはまらない）" aria-pressed="${answers[current] === 1}"></button>` : ""}
    </section>
    ${card.yes ? "" : `
    <div class="choices" role="group" aria-label="回答を選ぶ">
      ${CHOICES.map(c => `
        <button class="choice" data-pts="${c.pts}" aria-pressed="${answers[current] === c.pts}">
          <b>${c.label}</b><small>${c.sub}</small>
        </button>`).join("")}
    </div>`}
    <button class="back" id="back" ${current === 0 ? "disabled" : ""}>← 前の質問にもどる</button>
  ` : `
    ${progress}
    <section class="panel">
      ${img ? `<img class="q-img" src="${img}" width="1254" height="1254" alt="">` : ""}
      <p class="eyebrow">Q${current + 1}</p>
      <p class="q-text">${text}</p>
      <div class="choices" role="group" aria-label="回答を選ぶ">
        ${CHOICES.map(c => `
          <button class="choice" data-pts="${c.pts}" aria-pressed="${answers[current] === c.pts}">
            <b>${c.label}</b><small>${c.sub}</small>
          </button>`).join("")}
      </div>
    </section>
    <button class="back" id="back" ${current === 0 ? "disabled" : ""}>← 前の質問にもどる</button>
  `;
  app.querySelectorAll(".choice").forEach(btn => {
    btn.onclick = () => {
      answers[current] = Number(btn.dataset.pts);
      app.querySelectorAll(".choice").forEach(b => b.setAttribute("aria-pressed", b === btn));
      setTimeout(() => {
        if (current < QUESTIONS.length - 1) { current++; renderQuestion(); }
        else renderResult();
      }, 220);
    };
  });
  document.getElementById("back").onclick = () => { if (current > 0) { current--; renderQuestion(); } };
  window.scrollTo({ top: 0 });
}

function scoreAxes() {
  const s = Object.fromEntries(AXES.map(a => [a.key, 0]));
  QUESTIONS.forEach(([axis], i) => { s[axis] += answers[i] || 0; });
  return s;
}

function renderResult() {
  const s = scoreAxes();
  const total = Object.values(s).reduce((a, b) => a + b, 0);
  const max = PER_AXIS * AXES.length;
  const type = TYPES.find(t => total >= t.min);
  const sorted = [...AXES].sort((a, b) => s[b.key] - s[a.key]);
  const hi = sorted[0], lo = sorted[sorted.length - 1];
  const gap = s[hi.key] - s[lo.key];
  const showCombo = gap >= 2;
  const combo = showCombo ? COMBOS[`${hi.key}>${lo.key}`] : "4つの力のバランスがそろっているタイプ";
  const power = Math.max(.2, total / max);
  // 個別相談ボタンは YES が0〜14個の人に出す
  const yesCount = QUESTIONS.length - total;
  const canConsult = yesCount <= 14;
  const showCta = type.cta && canConsult;
  // YES が15個以上の人には、相談ボタンの代わりに「今できる一歩」を出す
  const showFirstStep = yesCount >= 15;

  const ctaHtml = showCta ? `
    <section class="panel cta">
      <p class="catch">${type.catch}</p>
      <a class="btn consult" href="${CONSULT_URL || "#"}" target="_blank" rel="noopener">${type.cta}</a>
    </section>` : "";

  app.innerHTML = `
    ${type.image ? `
    <section class="result-card">
      <img src="${type.image.src}" width="${type.image.w}" height="${type.image.h}" alt="">
      <h2 class="sr-only">診断結果 ${type.catch} ${type.name} ${type.text}</h2>
    </section>
    <section class="score">
      <p class="eyebrow">あなたのパートナー度</p>
      <p class="score-num">${total}<small>／${max}点</small></p>
    </section>` : `
    <div class="halo" style="--power:${power.toFixed(2)}" aria-hidden="true"><span></span><span></span><span></span></div>
    <section class="score">
      <p class="eyebrow">あなたのパートナー度</p>
      <p class="score-num">${total}<small>／${max}点</small></p>
      ${showCta ? "" : `<p class="catch">${type.catch}</p>`}
      <h2 class="type-name">${type.name}</h2>
    </section>
    <section class="panel">
      <p>${type.text}</p>
    </section>`}
    ${canConsult && type.min === 16 ? `<section class="result-card">
      <img src="invite1.webp" width="941" height="1672" alt="">
      <div class="sr-only">ここまで来たあなたは、もう“準備中”ではありません。守護霊からのサインを受け取り、それを人生やビジネスに活かしていける土台は整っています。あとは、あなたの守護霊がどんな形でメッセージを送っているのか、どうコミュニケーションを取ればいいのかを知るだけ。「自分の場合は、どんなサインで来る？」「今のビジネスにどう活かせる？」「守護霊をビジネスパートナーにして、次のステージへ進みたい」そう思った方は、友彩に相談してみてください。あなたに合った守護霊とのつながり方と、ビジネスへの活かし方を一緒に見ていきます。</div>
    </section>` : canConsult ? `<section class="result-card">
      <img src="invite2.webp" width="941" height="1672" alt="">
      <div class="sr-only">診断結果をビジネスのステージアップに活かしたい方へ。今のあなたは、守護霊からのサインを受け取る力はあるものの、まだ活かしきれていない部分があるかもしれません。「自分はどこで止まってる？」「どうしたら守護霊をビジネスパートナーにできる？」そこを友彩と一緒に整理したい方は、友彩に個別で相談へ。</div>
    </section>` : ""}
    ${showFirstStep ? `<section class="result-card">
      <img src="firststep.webp" width="941" height="1672" alt="">
      <div class="sr-only">今できる一歩。今は「守護霊とつながらなきゃ」と焦らなくていい時期。まずは、自分の感覚をとり戻すところから始めてみて。1日5分、スマホを置いて「今、私はどう感じてる？」と自分に聞いてみる。「なんか違うかも」と思ったことを、否定せずに一行だけ書き出す。「私はどうしたい？」の答えを、小さなことから一つ選んで決めてみる。決めたことを、今日のうちに5分だけやってみる。できたら、自分に花丸をつけてあげて。守護霊のサポートは、あなたが自分で動き始めた時に感じやすくなります。</div>
    </section>` : ""}
    ${ctaHtml}
    <p class="toast" id="toast" role="status"></p>
    <p class="note">この診断は、今の在り方を見つめるためのセルフチェックです。<br>結果は「今」のあなた。行動が変われば点数も変わります。</p>
  `;
  const toast = document.getElementById("toast");
  if (!CONSULT_URL) {
    app.querySelectorAll(".consult").forEach(a => {
      a.onclick = e => { e.preventDefault(); toast.textContent = "相談の受付ページは準備中です。"; };
    });
  }
  window.scrollTo({ top: 0 });
}

renderIntro();

// 背景の星空（ゆっくりまたたく）
(function stars() {
  const cv = document.getElementById("stars");
  if (!cv || !cv.getContext) return;
  const ctx = cv.getContext("2d");
  const still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let pts = [];
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(innerWidth * innerHeight / 5000);
    pts = Array.from({ length: n }, () => ({
      x: Math.random() * innerWidth, y: Math.random() * innerHeight,
      r: Math.random() * 1.2 + .2, p: Math.random() * Math.PI * 2, s: Math.random() * .8 + .3,
      gold: Math.random() < .18,
    }));
  }
  function draw(t) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const st of pts) {
      const a = still ? .7 : .35 + .65 * (0.5 + 0.5 * Math.sin(st.p + t / 1000 * st.s));
      ctx.globalAlpha = a;
      ctx.fillStyle = st.gold ? "#f2d38a" : "#efe6ff";
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2); ctx.fill();
    }
    if (!still) requestAnimationFrame(draw);
  }
  resize(); addEventListener("resize", resize);
  requestAnimationFrame(draw);
})();
</script>
